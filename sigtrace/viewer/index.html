<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sigtrace Viewer</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f1f0ec; --hover: rgba(11,11,11,.05);
  --text: #0b0b0b; --text-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
  --accent: #2a78d6; --accent-wash: rgba(42,120,214,.12); --band: rgba(11,11,11,.025);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --other: #b5b3ab;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --div-neg: #184f95; --div-mid: #f0efec; --div-pos: #b8302f; --nan: #fab219;
  --seq: #cde2fb,#b7d3f6,#9ec5f4,#86b6ef,#6da7ec,#5598e7,#3987e5,#2a78d6,#256abf,#1c5cab,#184f95,#104281,#0d366b;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422; --hover: rgba(255,255,255,.05);
    --text: #f0efec; --text-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --accent: #3987e5; --accent-wash: rgba(57,135,229,.18); --band: rgba(255,255,255,.025);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --other: #5f5e5a;
    --div-neg: #6da7ec; --div-mid: #383835; --div-pos: #e66767; --nan: #fab219;
    --seq: #0d366b,#104281,#184f95,#1c5cab,#256abf,#2a78d6,#3987e5,#5598e7,#6da7ec,#86b6ef,#9ec5f4,#b7d3f6,#cde2fb;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422; --hover: rgba(255,255,255,.05);
  --text: #f0efec; --text-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
  --accent: #3987e5; --accent-wash: rgba(57,135,229,.18); --band: rgba(255,255,255,.025);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --other: #5f5e5a;
  --div-neg: #6da7ec; --div-mid: #383835; --div-pos: #e66767; --nan: #fab219;
  --seq: #0d366b,#104281,#184f95,#1c5cab,#256abf,#2a78d6,#3987e5,#5598e7,#6da7ec,#86b6ef,#9ec5f4,#b7d3f6,#cde2fb;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--text); font: 13px/1.45 var(--sans); }
button, select, input { font: inherit; color: inherit; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.sec { color: var(--text-2); }
.num { font-variant-numeric: tabular-nums; }

header {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.brand { font-weight: 650; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
.brand svg { color: var(--accent); }
.model { font-family: var(--mono); font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
.chip { padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.spacer { flex: 1; }
.btn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 4px 10px; cursor: pointer;
}
.btn:hover { background: var(--hover); }
.btn[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent); }
.icon-btn { width: 30px; height: 28px; padding: 0; display: inline-grid; place-items: center; }

.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: calc(100vh - 49px); }
aside { border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.search { padding: 10px; border-bottom: 1px solid var(--border); }
.search input {
  width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--page);
}
#tree { overflow: auto; flex: 1; padding: 4px 0 16px; }
.trow {
  display: flex; align-items: center; gap: 6px; padding: 2px 10px 2px 8px; cursor: pointer; white-space: nowrap;
  border-left: 2px solid transparent; min-height: 24px;
}
.trow:hover { background: var(--hover); }
.trow.sel { background: var(--accent-wash); border-left-color: var(--accent); }
.trow.dim .tname { color: var(--muted); }
.caret { width: 16px; height: 16px; border: 0; background: none; padding: 0; cursor: pointer; color: var(--muted); flex: none; line-height: 1; }
.caret.sp { cursor: default; }
.tname { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; }
.ttype { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.tval { color: var(--text-2); font-variant-numeric: tabular-nums; font-size: 11.5px; }
.sev { flex: none; display: inline-block; width: 10px; height: 10px; }

main { overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card h2 { font-size: 14px; margin: 0; font-weight: 620; }
.card .sub { color: var(--text-2); margin: 2px 0 10px; }
.card-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }

.toolbar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.field { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.field > label, .field > .lab { color: var(--text-2); }
select { padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 4px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent-wash); color: var(--text); font-weight: 600; }
input[type=range] { width: 180px; accent-color: var(--accent); }
.steplabel { min-width: 140px; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--text-2); margin: 0 0 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

svg.chart { display: block; overflow: visible; }
svg .grid { stroke: var(--grid); stroke-width: 1; }
svg .axis { stroke: var(--axis); stroke-width: 1; }
svg .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .glabel { fill: var(--muted); font-size: 11px; font-family: var(--mono); }
svg .atitle { fill: var(--muted); font-size: 11px; }
svg .band { fill: var(--band); }
svg .line { fill: none; stroke: var(--text-2); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; opacity: .55; }
svg .sline { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg .area { fill: var(--s1); opacity: .14; }
svg .cross { stroke: var(--muted); stroke-width: 1; }
svg .selline { stroke: var(--accent); stroke-width: 1.5; }
svg .hit { fill: transparent; cursor: crosshair; }
svg .bar { fill: var(--s1); }
svg .bar.hl { fill: var(--s2); }
svg .ref { stroke: var(--text-2); stroke-width: 1; }
svg .reflabel { fill: var(--text-2); font-size: 11px; }

.tip {
  position: fixed; z-index: 50; pointer-events: none; display: none; max-width: 380px;
  background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; box-shadow: 0 6px 24px rgba(0,0,0,.18); font-size: 12px;
}
.tip b { font-family: var(--mono); font-weight: 600; }
.tip table { border-collapse: collapse; margin-top: 4px; }
.tip td { padding: 0 10px 0 0; font-variant-numeric: tabular-nums; }
.tip td:first-child { color: var(--text-2); }
.tip .warn { margin-top: 4px; }

.crumbs { color: var(--muted); font-family: var(--mono); font-size: 12px; display: flex; flex-wrap: wrap; gap: 2px; }
.crumbs a { color: var(--text-2); cursor: pointer; text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.dtitle { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 2px; }
.dtitle .path { font-family: var(--mono); font-size: 15px; font-weight: 620; word-break: break-all; }
.typechip { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); }
.extra { font-family: var(--mono); font-size: 12px; color: var(--text-2); word-break: break-word; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.tab { border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; background: var(--surface); cursor: pointer; font-family: var(--mono); font-size: 12px; }
.tab .muted { font-family: var(--sans); }
.tab[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-wash); }
.dgrid { display: grid; grid-template-columns: minmax(240px, 300px) minmax(0, 1fr); gap: 20px; align-items: start; }
.stats { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.stats td { padding: 3px 0; border-bottom: 1px solid var(--grid); }
.stats td:first-child { color: var(--text-2); }
.stats td:last-child { text-align: right; font-family: var(--mono); font-size: 12px; }
.panel-title { display: flex; align-items: baseline; gap: 10px; margin: 18px 0 6px; flex-wrap: wrap; }
.panel-title h3 { font-size: 13px; margin: 0; font-weight: 620; }
.panel-title .cap { color: var(--text-2); }
.panel-title .right { margin-left: auto; display: flex; gap: 10px; align-items: center; color: var(--text-2); }
.hm-wrap { position: relative; }
canvas { display: block; }
.scalebar { display: flex; align-items: center; gap: 8px; margin-top: 6px; color: var(--text-2); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.scalebar .grad { width: 180px; height: 10px; border-radius: 3px; }
.nanchip { display: inline-flex; gap: 6px; align-items: center; }
.nanchip i { width: 10px; height: 10px; background: var(--nan); display: inline-block; border-radius: 2px; }

table.params { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.params th { text-align: left; font-weight: 500; color: var(--text-2); border-bottom: 1px solid var(--axis); padding: 4px 8px 4px 0; }
table.params td { padding: 4px 8px 4px 0; border-bottom: 1px solid var(--grid); }
table.params td.r, table.params th.r { text-align: right; }
.scroll-x { overflow-x: auto; }

.alist { max-height: 200px; overflow: auto; margin-top: 8px; border-top: 1px solid var(--grid); }
.arow { display: grid; grid-template-columns: 16px 150px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 4px 4px; border-bottom: 1px solid var(--grid); cursor: pointer; }
.arow:hover { background: var(--hover); }
.arow .p { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.asum { display: flex; flex-wrap: wrap; gap: 8px; }
.asum .chip { display: inline-flex; align-items: center; gap: 6px; }
.ok { display: inline-flex; gap: 8px; align-items: center; color: var(--text-2); }
.warnlist { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
.warnlist div { display: flex; gap: 8px; align-items: center; }

.empty { color: var(--text-2); padding: 18px 0; }
.drop {
  margin: 8vh auto; max-width: 620px; text-align: center; padding: 40px 24px; border: 2px dashed var(--axis); border-radius: 14px; background: var(--surface);
}
.drop h1 { font-size: 20px; margin: 0 0 6px; }
.drop pre { text-align: left; background: var(--surface-2); padding: 12px; border-radius: 8px; overflow: auto; font-family: var(--mono); font-size: 12px; }
body.dragging .drop, body.dragging main { outline: 2px solid var(--accent); outline-offset: -6px; }
.err { background: var(--critical); color: #fff; padding: 8px 16px; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface-2); }

/* view tabs */
.views { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.views button { border: 0; background: var(--surface); padding: 4px 12px; cursor: pointer; }
.views button + button { border-left: 1px solid var(--border); }
.views button[aria-pressed="true"] { background: var(--accent-wash); font-weight: 600; }
.app.jepa-mode { grid-template-columns: minmax(0, 1fr); }
.app.jepa-mode > aside, .app.jepa-mode > #main { display: none; }
.app:not(.jepa-mode) > #jepa { display: none; }
#jepa { overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* JEPA view */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.tile .tl { color: var(--text-2); display: flex; align-items: center; gap: 8px; }
.tile .tv { font-size: 22px; font-weight: 620; margin: 4px 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .tv small { font-size: 13px; font-weight: 400; color: var(--text-2); }
.tile .ts { color: var(--text-2); font-size: 12px; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 1px 8px 1px 6px; border-radius: 999px; background: var(--surface-2); color: var(--text); white-space: nowrap; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 4px 0 12px; }
.rolebtn { display: inline-flex; align-items: center; gap: 6px; }
.land { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 18px; align-items: start; }
.land table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.land th { text-align: right; font-weight: 500; color: var(--text-2); padding: 3px 0 3px 6px; border-bottom: 1px solid var(--axis); }
.land th:first-child, .land td:first-child { text-align: left; padding-left: 0; }
.land td { text-align: right; padding: 4px 0 4px 6px; border-bottom: 1px solid var(--grid); }
.note { color: var(--text-2); font-size: 12px; margin-top: 8px; }
.multiples { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.multiples h4 { margin: 0 0 4px; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.multiples .cap { color: var(--text-2); font-size: 12px; }
table.health { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.health th { text-align: right; font-weight: 500; color: var(--text-2); padding: 4px 0 4px 10px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
table.health td { text-align: right; padding: 4px 0 4px 10px; border-bottom: 1px solid var(--grid); }
table.health th:first-child, table.health td:first-child { text-align: left; padding-left: 0; color: var(--text-2); }
.two { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.bars { display: flex; flex-direction: column; gap: 2px; }
.brow { display: grid; grid-template-columns: minmax(120px, 34%) minmax(0, 1fr) 72px; gap: 10px; align-items: center; padding: 2px 4px; border-radius: 6px; cursor: pointer; }
.brow:hover { background: var(--hover); }
.brow .bl { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.brow .bv { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); font-size: 12px; }
.track { position: relative; height: 14px; }
.track .fill { position: absolute; top: 0; height: 14px; }
.track .zero { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--axis); }
.role-tag { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }

@media (max-width: 860px) {
  .land, .two { grid-template-columns: minmax(0, 1fr); }
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  header { gap: 8px 12px; }
  .toolbar { gap: 10px 14px; }
  aside { max-height: 42vh; border-right: 0; border-bottom: 1px solid var(--border); }
  main { overflow: visible; }
  .dgrid { grid-template-columns: 1fr; }
  input[type=range] { width: 120px; }
  .arow { grid-template-columns: 16px minmax(0, 1fr) auto; }
  .arow .lbl { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M1 10h3l2-6 4 12 3-9 2 3h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    sigtrace
  </div>
  <span class="model" id="model-name"></span>
  <nav class="views" id="views" aria-label="View" hidden></nav>
  <div class="chips" id="meta"></div>
  <div class="spacer"></div>
  <label class="btn" title="Open a trace .json or .json.gz">Open trace…<input id="file" type="file" accept=".json,.gz,application/json" hidden></label>
  <button class="btn icon-btn" id="theme" title="Toggle light / dark" aria-label="Toggle light or dark theme">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>
  </button>
</header>
<div id="root"></div>
<div class="tip" id="tip"></div>

<script id="sigtrace-data" type="application/json">/*__SIGTRACE_DATA__*/null</script>
<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ DOM helpers */
const $ = (sel, root = document) => root.querySelector(sel);
const NS = 'http://www.w3.org/2000/svg';
function setAttrs(el, attrs) {
  if (!attrs) return;
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'style' && typeof v === 'object') { for (const [sk, sv] of Object.entries(v)) el.style.setProperty(sk, sv); }
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'text') el.textContent = v;
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
}
function append(el, kids) {
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false) continue;
    el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
}
function h(tag, attrs, ...kids) { const el = document.createElement(tag); setAttrs(el, attrs); append(el, kids); return el; }
function s(tag, attrs, ...kids) { const el = document.createElementNS(NS, tag); setAttrs(el, attrs); append(el, kids); return el; }
const esc = (x) => String(x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* storage unavailable */ } },
};

/* ------------------------------------------------------------------ formatting */
const minus = (t) => t.replace(/-/g, '−');
function fmt(v, sig = 4) {
  if (v == null || Number.isNaN(v)) return '—';
  if (!Number.isFinite(v)) return v > 0 ? '∞' : '−∞';
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1e5 || a < 1e-3) return minus(v.toExponential(Math.max(0, sig - 2)).replace('e+', 'e'));
  return minus(Number(v.toPrecision(sig)).toLocaleString('en-US', { maximumSignificantDigits: sig }));
}
const fmtShort = (v) => fmt(v, 3);
function fmtCount(n) {
  if (n == null) return '—';
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(a >= 1e10 ? 0 : 1) + 'B';
  if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M';
  if (a >= 1e4) return (n / 1e3).toFixed(a >= 1e5 ? 0 : 1) + 'K';
  return n.toLocaleString('en-US');
}
const fmtPct = (v) => (v == null ? '—' : (v * 100).toFixed(v > 0 && v < 0.001 ? 3 : 1) + '%');
const fmtShape = (sh) => (sh && sh.length ? sh.join('×') : 'scalar');

/* ------------------------------------------------------------------ scales */
function niceTicks(a, b, n = 5) {

function groupsFor(vis) {

    const maxRun = Math.max(...runs.map((r) => r.end - r.start + 1)) / n;
    if (runs.length >= 2 && runs.length <= 80 && maxRun <= 0.5) return runs;
  }

}

/* ------------------------------------------------------------------ colour ramps */
function hexToRgb(hex) {
  const v = hex.replace('#', '');
  return [parseInt(v.slice(0, 2), 16), parseInt(v.slice(2, 4), 16), parseInt(v.slice(4, 6), 16)];
}
const mix = (a, b, t) => [0, 1, 2].map((i) => Math.round(a[i] + (b[i] - a[i]) * t));
function seqRamp() {
  const stops = cssVar('--seq').split(',').map((x) => hexToRgb(x.trim()));
  return (t) => {
    t = Math.max(0, Math.min(1, t));
    const p = t * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(p));
    return mix(stops[i], stops[i + 1], p - i);
  };
}

  return (t) => { // t in [-1, 1]
    t = Math.max(-1, Math.min(1, t));

}

  return `linear-gradient(90deg, ${stops.join(',')})`;
}

  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}

    h('span', { class: 'grad', style: { background: gradientCss(diverging ? (t) => ramp(t) : ramp, diverging ? -1 : 0, 1) } }),
    h('span', {}, lab(hi)),
    h('span', { class: 'muted' }, scale.kind === 'log' ? '(log)' : scale.kind === 'symlog' ? '(symmetric log)' : ''),
    h('span', { class: 'nanchip' }, h('i', { style: { background: 'var(--surface-2)', border: '1px solid var(--border)' } }), 'not called')));
}

/* ------------------------------------------------------------------ details */
function renderDetails() {
  const host = $('#details');
  host.innerHTML = '';
  if (!state.sel) { host.append(h('div', { class: 'empty' }, 'Select a module in the tree or click a point in the chart.')); return; }
  const m = D.mods[state.sel.module];
  const chain = [];
  for (let x = m; x; x = x.parent != null ? D.mods[x.parent] : null) chain.unshift(x);
  host.append(h('div', { class: 'crumbs' }, chain.slice(0, -1).map((c, i) => [i ? h('span', {}, '›') : null, h('a', { onclick: () => select(c.id) }, c.name)])));
  host.append(h('div', { class: 'dtitle' },
    h('span', { class: 'path' }, m.path || m.name),
    h('span', { class: 'typechip' }, h('i', { class: 'sw', style: { background: m.id === 0 ? 'var(--muted)' : typeColor(m.type) } }), m.type),
    m.role && h('span', { class: 'typechip' }, h('i', { class: 'sw', style: { background: roleColor(m.role) } }), roleName(m.role)),
    h('span', { class: 'muted' }, m.n_params_total ? `${fmtCount(m.n_params_total)} params` + (m.n_params_total !== m.n_params ? ` (${fmtCount(m.n_params)} own)` : '') : 'no params')));
  if (m.extra) host.append(h('div', { class: 'extra' }, m.extra));
  const inf = D.influence.get(m.id);
  if (inf) {
    const parts = [];
    if (inf.d_loss != null) parts.push(['Δloss when ablated', fmtSigned(inf.d_loss)]);
    if (inf.pred_drift != null) parts.push(['prediction drift', fmt(inf.pred_drift, 3)]);
    if (inf.ctx_drift != null) parts.push(['context drift', fmt(inf.ctx_drift, 3)]);
    if (inf.tgt_drift != null) parts.push(['target drift', fmt(inf.tgt_drift, 3)]);
    if (inf.attr != null) parts.push(['grad × act', fmt(inf.attr, 3)]);
    if (inf.error) parts.push(['ablation failed', inf.error]);
    host.append(h('div', { class: 'note' }, h('b', {}, 'JEPA influence: '),
      parts.map(([k, v], i) => [i ? ' · ' : '', k, ' ', h('span', { class: 'mono' }, v)])));
  }

  const evs = D.byStepModule[state.step].get(m.id) || [];
  if (evs.length > 1) {
    host.append(h('div', { class: 'tabs' }, h('span', { class: 'sec', style: { 'align-self': 'center' } }, 'Calls this step'),
      evs.map((ev) => h('button', { class: 'tab', 'aria-pressed': String(ev.call === state.sel.call), onclick: () => select(m.id, ev.call) }, `#${ev.call + 1}`))));
  }
  const ev = evs.find((e) => e.call === state.sel.call) || evs[0];
  if (!ev) {
    host.append(h('div', { class: 'empty' }, m.traced ? 'This module was not called during this step.' : 'This module was not traced (excluded by include / exclude / leaves_only / max_depth).'));
  } else {
    if (ev.anomalies.length) host.append(h('div', { class: 'warnlist' }, ev.anomalies.map((a) => h('div', {}, sevIcon(a.sev), h('b', {}, a.label), h('span', { class: 'sec' }, a.detail)))));
    const tensors = [...(ev.inputs || []).map((t) => ({ ...t, role: 'in' })), ...(ev.outputs || []).map((t) => ({ ...t, role: 'out' }))];
    if (!tensors.length) host.append(h('div', { class: 'empty' }, 'No tensors captured for this call.'));
    else {
      let cur = tensors.find((t) => t.name === state.tensor) || tensors.find((t) => t.role === 'out') || tensors[0];
      host.append(h('div', { class: 'tabs' }, tensors.map((t) => h('button', {
        class: 'tab', 'aria-pressed': String(t === cur), onclick: () => { state.tensor = t.name; renderDetails(); },
      }, t.name, ' ', h('span', { class: 'muted' }, fmtShape(t.shape))))));
      const dropped = (cur.role === 'in' ? ev.inputs_dropped : ev.outputs_dropped);
      renderTensor(host, cur, ev, dropped);
    }
  }
  if (D.steps.length > 1 && ev) renderStepsMini(host, m, state.sel.call);
  renderParams(host, m);
}

function renderTensor(host, t, ev, dropped) {
  const g = gainOf(ev);
  const rows = [
    ['shape', fmtShape(t.shape)], ['dtype', t.dtype], ['elements', fmtCount(t.numel)],
    ['mean', fmt(t.mean)], ['std', fmt(t.std)], ['rms', fmt(t.rms)], ['mean |x|', fmt(t.abs_mean)],
    ['min', fmt(t.min)], ['max', fmt(t.max)],
  ];
  if (t.q) rows.push(['p1 / p25', `${fmt(t.q[0])} / ${fmt(t.q[1])}`], ['median', fmt(t.q[2])], ['p75 / p99', `${fmt(t.q[3])} / ${fmt(t.q[4])}`]);
  rows.push(['exact zeros', fmtPct(t.zero_frac)], ['NaN / Inf', `${t.nan ?? 0} / ${t.inf ?? 0}`]);
  if (g != null) rows.push(['gain (out ÷ in RMS)', fmt(g, 3)]);
  if (ev.ms != null) rows.push(['time', `${fmt(ev.ms, 3)} ms`]);
  if (dropped) rows.push(['tensors not captured', String(dropped)]);
  const histHost = h('div');
  host.append(h('div', { class: 'dgrid' },
    h('table', { class: 'stats' }, h('tbody', {}, rows.map(([k, v]) => h('tr', {}, h('td', {}, k), h('td', {}, v))))),
    h('div', {},
      h('div', { class: 'panel-title', style: { 'margin-top': 0 } }, h('h3', {}, 'Value distribution'),
        h('span', { class: 'cap' }, `${t.hist ? t.hist.counts.length : 0} bins`),
        h('label', { class: 'right' }, h('input', { type: 'checkbox', checked: state.histLog, onchange: (e) => { state.histLog = e.target.checked; renderDetails(); } }), 'Log counts')),
      histHost)));
  if (t.hist) requestAnimationFrame(() => drawHist(histHost, t));
  else histHost.append(h('div', { class: 'empty' }, 'No finite values.'));
  if (t.heatmap) renderHeatmap(host, t.heatmap);
  if (t.channels) renderChannels(host, t.channels);
}

function drawHist(host, t) {
  const W = Math.max(240, host.clientWidth), H = 180, M = { l: 44, r: 8, t: 8, b: 26 };
  const pw = W - M.l - M.r, ph = H - M.t - M.b;
  const { lo, hi, counts } = t.hist;
  const n = counts.length, bw = pw / n;
  const tr = (c) => (state.histLog ? Math.log10(1 + c) : c);
  const cmax = Math.max(1, ...counts.map(tr));
  const y = (c) => M.t + ph - (tr(c) / cmax) * ph;
  const x = (v) => M.l + ((v - lo) / (hi - lo)) * pw;
  const svg = s('svg', { width: W, height: H, class: 'chart', role: 'img', 'aria-label': 'Histogram of values' });
  const yt = state.histLog ? [0, 1, 2, 3, 4, 5, 6, 7, 8].map((e) => 10 ** e).filter((v) => Math.log10(1 + v) <= cmax * 1.0001) : niceTicks(0, cmax, 3);
  for (const v of yt) {
    const yy = y(v);
    svg.append(s('line', { x1: M.l, x2: W - M.r, y1: yy, y2: yy, class: 'grid' }));
    svg.append(s('text', { x: M.l - 6, y: yy + 4, class: 'tick', 'text-anchor': 'end' }, fmtCount(v)));
  }
  const gap = bw > 4 ? 1 : 0;
  counts.forEach((c, i) => {
    if (!c) return;
    const top = y(c), hgt = Math.max(1, M.t + ph - top), w = Math.max(1, bw - gap);
    const r = Math.min(2, w / 2, hgt);
    const x0 = M.l + i * bw, yb = M.t + ph;
    svg.append(s('path', { class: 'bar', d: `M${x0},${yb}V${top + r}Q${x0},${top} ${x0 + r},${top}H${x0 + w - r}Q${x0 + w},${top} ${x0 + w},${top + r}V${yb}Z` }));
  });
  svg.append(s('line', { x1: M.l, x2: W - M.r, y1: M.t + ph, y2: M.t + ph, class: 'axis' }));
  for (const v of niceTicks(lo, hi, Math.max(2, Math.floor(pw / 80)))) {
    if (v < lo || v > hi) continue;
    svg.append(s('text', { x: x(v), y: H - 8, class: 'tick', 'text-anchor': 'middle' }, fmtTick(v)));
  }
  if (lo < 0 && hi > 0) svg.append(s('line', { x1: x(0), x2: x(0), y1: M.t, y2: M.t + ph, class: 'axis' }));
  if (t.mean != null && t.mean >= lo && t.mean <= hi) {
    svg.append(s('line', { x1: x(t.mean), x2: x(t.mean), y1: M.t, y2: M.t + ph, class: 'ref' }));
    const right = x(t.mean) < M.l + pw - 70;
    svg.append(s('text', { x: x(t.mean) + (right ? 4 : -4), y: M.t + 10, class: 'reflabel', 'text-anchor': right ? 'start' : 'end' }, 'mean'));
  }
  const hit = s('rect', { x: M.l, y: M.t, width: pw, height: ph, class: 'hit' });
  hit.addEventListener('mousemove', (e) => {
    const r = svg.getBoundingClientRect(), i = Math.max(0, Math.min(n - 1, Math.floor((e.clientX - r.left - M.l) / bw)));
    const a = lo + ((hi - lo) * i) / n, b = lo + ((hi - lo) * (i + 1)) / n;
    showTip(`<table><tr><td>range</td><td>${esc(fmt(a))} … ${esc(fmt(b))}</td></tr><tr><td>count</td><td>${counts[i].toLocaleString('en-US')}</td></tr></table>`, e.clientX, e.clientY);
  });
  hit.addEventListener('mouseleave', hideTip);
  svg.append(hit);
  host.innerHTML = '';
  host.append(svg);
}

const LAYOUT_TEXT = {
  vector: 'Values in order',
  matrix: 'Rows: dim 0 · columns: dim 1',
  sequence: 'Batch item 0 · rows: dim 1 (e.g. sequence position) · columns: last dim (features)',
  flattened: 'Batch item 0 flattened to rows × last dim',
  mosaic: 'Batch item 0 · one tile per channel (feature map)',
};
function decodeQ(hm) {
  if (!hm._bytes) {
    const bin = atob(hm.q), a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    hm._bytes = a;
  }
  return hm._bytes;
}
function renderHeatmap(host, hm) {
  const bytes = decodeQ(hm);
  const { rows, cols } = hm, lo = hm.lo ?? 0, hi = hm.hi ?? 0;
  const val = (b) => lo + (b / 254) * (hi - lo);
  const pooled = hm.src && (hm.src[0] !== rows || hm.src[1] !== cols);
  let cap = LAYOUT_TEXT[hm.layout] || '';
  if (hm.layout === 'mosaic') cap = `First ${hm.channels} channels of batch item 0, ${hm.tile[0]}×${hm.tile[1]} per tile`;
  if (pooled) cap += ` · average-pooled from ${hm.src[0]}×${hm.src[1]}`;
  const wrap = h('div', { class: 'hm-wrap' });
  host.append(h('div', { class: 'panel-title' }, h('h3', {}, 'Activation map'), h('span', { class: 'cap' }, cap)), wrap);
  requestAnimationFrame(() => {
    const W = Math.max(240, wrap.clientWidth);
    const mosaic = hm.layout === 'mosaic';
    const gap = mosaic ? 3 : 0;
    const nc = mosaic ? hm.grid[1] : 1, nr = mosaic ? hm.grid[0] : 1;
    const maxH = 380;
    let cw, chh;
    if (mosaic) { cw = chh = Math.max(1, Math.min((W - (nc - 1) * gap) / cols, (maxH - (nr - 1) * gap) / rows)); }
    else { cw = W / cols; chh = Math.max(2, Math.min(maxH / rows, Math.max(cw, 150 / rows))); }
    const totalW = mosaic ? cols * cw + (nc - 1) * gap : W;
    const totalH = rows * chh + (mosaic ? (nr - 1) * gap : 0);
    const cv = h('canvas', { role: 'img', 'aria-label': 'Activation heatmap' });
    const ctx = setupCanvas(cv, totalW, totalH);
    const diverging = lo < 0 && hi > 0;
    const amax = Math.max(Math.abs(lo), Math.abs(hi)) || 1;
    const ramp = diverging ? divRamp() : seqRamp();
    const lut = new Array(256);
    for (let b = 0; b < 255; b++) lut[b] = rgb(diverging ? ramp(val(b) / amax) : ramp(hi > lo ? b / 254 : 0.5));
    lut[255] = cssVar('--nan');
    const xOf = (c) => c * cw + (mosaic ? Math.floor(c / hm.tile[1]) * gap : 0);
    const yOf = (r) => r * chh + (mosaic ? Math.floor(r / hm.tile[0]) * gap : 0);
    let hasNan = false;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (mosaic) {
          const tile = Math.floor(r / hm.tile[0]) * nc + Math.floor(c / hm.tile[1]);
          if (tile >= hm.channels) continue;
        }
        const b = bytes[r * cols + c];
        if (b === 255) hasNan = true;
        ctx.fillStyle = lut[b];
        const x0 = Math.round(xOf(c)), x1 = Math.round(xOf(c) + cw), y0 = Math.round(yOf(r)), y1 = Math.round(yOf(r) + chh);
        ctx.fillRect(x0, y0, Math.max(1, x1 - x0), Math.max(1, y1 - y0));
      }
    }
    const locate = (e) => {
      const rc = cv.getBoundingClientRect();
      const px = e.clientX - rc.left, py = e.clientY - rc.top;
      let c, r;
      if (mosaic) {
        const tw = hm.tile[1] * cw + gap, th = hm.tile[0] * chh + gap;
        const tc = Math.floor(px / tw), trr = Math.floor(py / th);
        c = tc * hm.tile[1] + Math.floor((px - tc * tw) / cw);
        r = trr * hm.tile[0] + Math.floor((py - trr * th) / chh);
        if ((px - tc * tw) / cw >= hm.tile[1] || (py - trr * th) / chh >= hm.tile[0]) return null;
      } else { c = Math.floor(px / cw); r = Math.floor(py / chh); }
      return r >= 0 && r < rows && c >= 0 && c < cols ? [r, c] : null;
    };
    cv.addEventListener('mousemove', (e) => {
      const p = locate(e);
      if (!p) { hideTip(); return; }
      const [r, c] = p, b = bytes[r * cols + c];
      let where;
      if (mosaic) {
        const ch = Math.floor(r / hm.tile[0]) * nc + Math.floor(c / hm.tile[1]);
        if (ch >= hm.channels) { hideTip(); return; }
        where = [['channel', ch], ['position', `${r % hm.tile[0]}, ${c % hm.tile[1]}`]];
      } else if (pooled) {
        const r0 = Math.floor((r * hm.src[0]) / rows), r1 = Math.ceil(((r + 1) * hm.src[0]) / rows) - 1;
        const c0 = Math.floor((c * hm.src[1]) / cols), c1 = Math.ceil(((c + 1) * hm.src[1]) / cols) - 1;
        where = [['rows', r0 === r1 ? r0 : `${r0}–${r1}`], ['cols', c0 === c1 ? c0 : `${c0}–${c1}`]];
      } else where = [['row', r], ['col', c]];
      const v = b === 255 ? 'NaN / Inf' : fmt(val(b), 3) + (pooled || mosaic ? ' (avg)' : '');
      showTip(`<table>${where.map(([k, x]) => `<tr><td>${k}</td><td>${x}</td></tr>`).join('')}<tr><td>value</td><td>${esc(v)}</td></tr></table>`, e.clientX, e.clientY);
    });
    cv.addEventListener('mouseleave', hideTip);
    wrap.append(cv);
    wrap.append(h('div', { class: 'scalebar' },
      h('span', {}, fmt(diverging ? -amax : lo, 3)),
      h('span', { class: 'grad', style: { background: diverging ? gradientCss(ramp, -1, 1) : gradientCss(ramp, 0, 1) } }),
      h('span', {}, fmt(diverging ? amax : hi, 3)),
      diverging && h('span', { class: 'muted' }, 'blue negative · gray zero · red positive'),
      hasNan && h('span', { class: 'nanchip' }, h('i'), 'NaN / Inf')));
  });
}

function renderChannels(host, chs) {
  const wrap = h('div');
  const pooled = chs.values.length < chs.n;
  const top = chs.top.slice(0, 5);
  host.append(h('div', { class: 'panel-title' },
    h('h3', {}, 'Channel profile'),
    h('span', { class: 'cap' }, `Mean |x| per channel along dim ${chs.axis} (${chs.n} channels${pooled ? `, max-pooled to ${chs.values.length} bars` : ''})`)), wrap);
  requestAnimationFrame(() => {
    const W = Math.max(240, wrap.clientWidth), H = 150, M = { l: 44, r: 8, t: 10, b: 22 };
    const pw = W - M.l - M.r, ph = H - M.t - M.b;
    const vals = chs.values.map((v) => v ?? 0), n = vals.length, bw = pw / n;
    const vmax = Math.max(1e-12, ...vals);
    const y = scaleLinear(0, vmax * 1.05, M.t + ph, M.t);
    const svg = s('svg', { width: W, height: H, class: 'chart', role: 'img', 'aria-label': 'Per-channel mean absolute value' });
    for (const tv of y.ticks()) {
      svg.append(s('line', { x1: M.l, x2: W - M.r, y1: y(tv), y2: y(tv), class: 'grid' }));
      svg.append(s('text', { x: M.l - 6, y: y(tv) + 4, class: 'tick', 'text-anchor': 'end' }, fmtTick(tv)));
    }
    const gap = bw > 4 ? 1 : 0;
    const hiThresh = chs.median > 0 ? chs.median * 6 : Infinity;
    vals.forEach((v, i) => {
      if (!v) return;
      const top = y(v), w = Math.max(1, bw - gap), hgt = Math.max(1, M.t + ph - top);
      svg.append(s('rect', { x: M.l + i * bw, y: top, width: w, height: hgt, class: 'bar' + (v >= hiThresh ? ' hl' : '') }));
    });
    svg.append(s('line', { x1: M.l, x2: W - M.r, y1: M.t + ph, y2: M.t + ph, class: 'axis' }));
    if (chs.median != null) {
      svg.append(s('line', { x1: M.l, x2: W - M.r, y1: y(chs.median), y2: y(chs.median), class: 'ref' }));
      svg.append(s('text', { x: W - M.r, y: y(chs.median) - 4, class: 'reflabel', 'text-anchor': 'end' }, `median ${fmt(chs.median, 3)}`));
    }
    svg.append(s('text', { x: M.l, y: H - 6, class: 'tick' }, '0'));
    svg.append(s('text', { x: W - M.r, y: H - 6, class: 'tick', 'text-anchor': 'end' }, String(chs.n - 1)));
    svg.append(s('text', { x: M.l + pw / 2, y: H - 6, class: 'atitle', 'text-anchor': 'middle' }, 'channel'));
    const hit = s('rect', { x: M.l, y: M.t, width: pw, height: ph, class: 'hit' });
    hit.addEventListener('mousemove', (e) => {
      const r = svg.getBoundingClientRect(), i = Math.max(0, Math.min(n - 1, Math.floor((e.clientX - r.left - M.l) / bw)));
      const a = Math.floor((i * chs.n) / n), b = Math.ceil(((i + 1) * chs.n) / n) - 1;
      const ratio = chs.median > 0 ? ` (${fmt(vals[i] / chs.median, 3)}× median)` : '';
      showTip(`<table><tr><td>${a === b ? 'channel' : 'channels'}</td><td>${a === b ? a : `${a}–${b}`}</td></tr><tr><td>${a === b ? 'mean |x|' : 'max of mean |x|'}</td><td>${esc(fmt(vals[i], 3) + ratio)}</td></tr></table>`, e.clientX, e.clientY);
    });
    hit.addEventListener('mouseleave', hideTip);
    svg.append(hit);
    wrap.append(svg);
    wrap.append(h('div', { class: 'sec', style: { 'margin-top': '4px' } }, 'Largest channels: ',
      top.map(([c, v], i) => [i ? ' · ' : '', h('span', { class: 'mono' }, `#${c}`), ` ${fmt(v, 3)}`, chs.median > 0 ? h('span', { class: 'muted' }, ` (${fmt(v / chs.median, 3)}×)`) : ''])));
  });
}

function renderStepsMini(host, m, call) {
  const key = m.id + ':' + call;
  const met = METRICS[state.metric];
  const mkey = met.range ? 'mean' : state.metric;
  const wrap = h('div');
  host.append(h('div', { class: 'panel-title' }, h('h3', {}, `${METRICS[mkey].label} across steps`), h('span', { class: 'cap' }, 'this module only · click a point to jump to that step')), wrap);
  requestAnimationFrame(() => {
    const W = Math.max(240, wrap.clientWidth), H = 130, M = { l: 56, r: 12, t: 10, b: 22 };
    const pw = W - M.l - M.r, ph = H - M.t - M.b, ns = D.steps.length;
    const evs = D.steps.map((_, si) => D.byStep[si].get(key));
    const vals = evs.map((ev) => (ev ? metricValue(ev, mkey) : null));
    const y = yScaleFor(vals, mkey, M.t + ph, M.t);
    const x = (i) => M.l + (ns === 1 ? pw / 2 : (i * pw) / (ns - 1));
    const svg = s('svg', { width: W, height: H, class: 'chart', role: 'img', 'aria-label': `${METRICS[mkey].label} of ${m.path} across steps` });
    for (const tv of y.ticks()) {
      const yy = y(tv);
      if (yy < M.t - 1 || yy > M.t + ph + 1) continue;
      svg.append(s('line', { x1: M.l, x2: W - M.r, y1: yy, y2: yy, class: 'grid' }));
      svg.append(s('text', { x: M.l - 6, y: yy + 4, class: 'tick', 'text-anchor': 'end' }, METRICS[mkey].pct ? fmtPct(tv) : fmtTick(tv)));
    }
    svg.append(s('line', { x1: M.l, x2: W - M.r, y1: M.t + ph, y2: M.t + ph, class: 'axis' }));
    const pts = vals.map((v, i) => (y.valid(v) ? [x(i), y(v)] : null));
    let d = '', pen = false;
    for (const p of pts) { if (p) { d += (pen ? 'L' : 'M') + p[0] + ',' + p[1]; pen = true; } else pen = false; }
    if (d) svg.append(s('path', { d, class: 'sline' }));
    pts.forEach((p, i) => { if (p) svg.append(s('circle', { cx: p[0], cy: p[1], r: i === state.step ? 5 : 3, style: { fill: 'var(--s1)', stroke: 'var(--surface)', 'stroke-width': '2px' } })); });
    if (pts[state.step]) svg.append(s('circle', { cx: pts[state.step][0], cy: pts[state.step][1], r: 7.5, style: { fill: 'none', stroke: 'var(--text)', 'stroke-width': '1.5px' } }));

  const ins = (I.inputs || []).filter((r) => r.d_loss != null || r.error);
  const inItems = ins.filter((r) => r.d_loss != null).map((r) => ({ label: r.name, value: r.d_loss, color: 'var(--accent)', tip: inflTip(`input “${r.name}” shuffled`, r) + `<div class="muted">shape ${fmtShape(r.shape)}</div>` }));
  return card('Module influence', `${im.label}: ${im.desc}. The clean loss is ${fmt(I.loss_clean, 4)}; ablation mode: ${I.mode}. Click a module to open it in Signals.`,
    controls, legend,
    I.attribution_error && h('div', { class: 'note' }, sevIcon('warning'), ' ', I.attribution_error),
    h('div', { class: 'two' },
      h('div', {}, items.length ? barRows(items, im.f, goto) : h('div', { class: 'empty' }, 'No modules with this measure in the current filter.'),
        recs.length > 25 && h('div', { class: 'note' }, `Showing the top 25 of ${recs.length}.`)),
      h('div', {}, h('div', { class: 'panel-title', style: { 'margin-top': 0 } }, h('h3', {}, 'Input influence'), h('span', { class: 'cap' }, 'Δloss when one input is shuffled across the batch')),
        inItems.length ? barRows(inItems, fmtSigned) : h('div', { class: 'empty' }, 'No batched tensor inputs to shuffle.'),
        h('div', { class: 'note' }, 'Shuffling breaks the pairing between this input and everything else in the sample. A world model that ignores its actions shows near-zero drift for the action input.'))));
}

/* ------------------------------------------------------------------ loading */
function showEmpty(msg) {
  D = null;
  $('#model-name').textContent = '';
  $('#meta').innerHTML = '';
  const root = $('#root');
  root.innerHTML = '';
  if (msg) root.append(h('div', { class: 'err' }, msg));
  root.append(h('div', { class: 'drop' },
    h('h1', {}, 'Drop a trace file here'),
    h('p', { class: 'sec' }, 'A .json or .json.gz written by sigtrace — or use “Open trace…” above.'),
    h('pre', {}, `from sigtrace import SignalTracer

with torch.inference_mode(), SignalTracer(model) as tracer:
    model(inputs)

tracer.save_html("trace.html")   # self-contained viewer
tracer.save("trace.json.gz")     # or a raw trace for this page`)));
}
function load(T) {
  try {
    D = prepare(T);
    state.step = 0; state.sel = null; state.tensor = null; state.expanded = new Set();
    state.view = D.jepa && location.hash !== '#signals' ? 'jepa' : 'signals';
    if (!D.jepa && METRICS[state.metric].jepa) state.metric = 'rms';
    buildApp();
  } catch (err) {
    console.error(err);
    showEmpty('Could not load trace: ' + err.message);
  }
}
async function readFile(file) {
  let stream = file.stream();
  const head = new Uint8Array(await file.slice(0, 2).arrayBuffer());
  if (head[0] === 0x1f && head[1] === 0x8b) stream = stream.pipeThrough(new DecompressionStream('gzip'));
  const text = await new Response(stream).text();
  load(JSON.parse(text));
}
$('#file').addEventListener('change', (e) => { const f = e.target.files[0]; if (f) readFile(f).catch((err) => showEmpty('Could not read file: ' + err.message)); });
let dragDepth = 0;
window.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  const f = e.dataTransfer.files[0];
  if (f) readFile(f).catch((err) => showEmpty('Could not read file: ' + err.message));
});

/* ------------------------------------------------------------------ theme */
function applyTheme(t) {
  if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
}
applyTheme(store.get('sigtrace-theme'));
$('#theme').addEventListener('click', () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark'
    || (!document.documentElement.hasAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  const next = dark ? 'light' : 'dark';
  applyTheme(next);
  store.set('sigtrace-theme', next);
  if (D) renderAll();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (D) renderAll(); });

/* ------------------------------------------------------------------ boot */
window.addEventListener('error', (e) => {
  const bar = h('div', { class: 'err' }, 'Viewer error: ' + (e.message || e));
  document.body.prepend(bar);
});
(async () => {
  let embedded = null;
  try { embedded = JSON.parse($('#sigtrace-data').textContent); } catch { embedded = null; }
  if (embedded) return load(embedded);
  const url = new URLSearchParams(location.search).get('trace');
  if (url) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      let body = res.body;
      if (/\.gz$/.test(url) && !(res.headers.get('content-encoding') || '').includes('gzip')) body = body.pipeThrough(new DecompressionStream('gzip'));
      return load(JSON.parse(await new Response(body).text()));
    } catch (err) { return showEmpty(`Could not fetch ${url}: ${err.message}`); }
  }
  showEmpty();
})();
})();
</script>
</body>
